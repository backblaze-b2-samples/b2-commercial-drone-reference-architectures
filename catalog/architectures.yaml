  - id: opendronemap-photogrammetry-pipeline
    name: OpenDroneMap Photogrammetry Pipeline
    url: https://github.com/backblaze-b2-samples/opendronemap-photogrammetry-pipeline
    group: workflow
    summary: Presigned-PUT drone photo upload, local NodeODM reconstruction, and managed multipart write-back of orthomosaic, DEM, point cloud and mesh
    description: Drone photos upload by presigned PUT into mission prefixes, a local NodeODM engine reconstructs them, and the orthomosaic, DEM, point cloud and mesh return to B2 with managed multipart upload; JSON mission manifests replace a database.
    architectures: [flight-capture-offload, photogrammetry-processing]

  - id: yolo-drone-footage-detection
    name: YOLO Drone Footage Detection
    url: https://github.com/backblaze-b2-samples/yolo-drone-footage-detection
    group: workflow
    summary: Multipart video ingest, Ultralytics YOLO keyframe detection, GPX/SRT geotagging and a GeoJSON track on B2
    description: Drone video streams to B2 by multipart upload; Ultralytics YOLO runs on sampled keyframes, detections are geotagged from GPX/SRT telemetry, and annotated frames, per-frame JSON and a GeoJSON track are written back.
    architectures: [ai-inspection-detection]

  - id: titiler-cog-map-tiles
    name: TiTiler COG Map Tiles
    url: https://github.com/backblaze-b2-samples/titiler-cog-map-tiles
    group: workflow
    summary: GeoTIFF-to-COG conversion and dynamic XYZ tiles through GDAL /vsis3/ range reads with no stored tile copy
    description: GeoTIFFs are converted to COGs in B2 and TiTiler serves dynamic XYZ tiles through GDAL /vsis3/ range reads, so no tile pyramid is stored.
    architectures: [cog-map-serving]

  - id: roboflow-inference-frame-archive
    name: Roboflow Inference Frame Archive
    url: https://github.com/backblaze-b2-samples/roboflow-inference-frame-archive
    group: workflow
    summary: Edge inference that archives only flagged frames and prediction JSON, with hourly Parquet roll-ups
    description: Roboflow Inference runs locally and archives only flagged frames and prediction JSON to B2 with Parquet roll-ups; built around cameras, the same pattern fits a ground station or dock computer.
    architectures: [ai-inspection-detection]

  - id: yolo11-batch-detection-pipeline
    name: YOLO11 Batch Detection Pipeline
    url: https://github.com/backblaze-b2-samples/yolo11-batch-detection-pipeline
    group: workflow
    summary: Batch detection and segmentation over a B2 image and video library, writing COCO JSON, annotated frames and crops
    description: Batch detection and segmentation runs over an image and video library in B2 and writes COCO JSON, annotated frames and crops back; used here for model-version reprocessing.
    architectures: [ai-inspection-detection]

  - id: open3d-point-cloud-pipeline
    name: Open3D Point Cloud Pipeline
    url: https://github.com/backblaze-b2-samples/open3d-point-cloud-pipeline
    group: workflow
    summary: PLY/PCD/LAS/LAZ ingest, downsampling, registration and meshing with a job manifest on B2
    description: Point cloud scans are ingested, downsampled, registered and meshed, with artifacts and a job manifest written to B2; it complements PDAL and does not replace COPC/EPT conversion.
    architectures: [point-cloud-3d-streaming]

  - id: colmap-photogrammetry-archive
    name: COLMAP Photogrammetry Archive
    url: https://github.com/backblaze-b2-samples/colmap-photogrammetry-archive
    group: workflow
    summary: pycolmap SfM that archives photos, database, sparse model and point cloud per project, served by presigned URL
    description: pycolmap structure-from-motion archives photos, the COLMAP database, sparse model and point cloud per project on B2 and serves them by presigned URL.
    architectures: [photogrammetry-processing]

  - id: colmap-gaussian-splatting-pipeline
    name: COLMAP Gaussian Splatting Pipeline
    url: https://github.com/backblaze-b2-samples/colmap-gaussian-splatting-pipeline
    group: workflow
    summary: Photos or video to a COLMAP reconstruction and a Nerfstudio/gsplat-ready bundle versioned on B2
    description: Photos or video become a COLMAP reconstruction and a Nerfstudio/gsplat-ready bundle versioned on B2, a pattern for site digital twins.
    architectures: [point-cloud-3d-streaming]

  - id: sam2-mask-dataset-builder
    name: SAM 2 Mask Dataset Builder
    url: https://github.com/backblaze-b2-samples/sam2-mask-dataset-builder
    group: building-block
    summary: Versioned segmentation datasets built from a raw B2 media archive with local SAM 2
    description: A raw image and video archive on B2 becomes a versioned segmentation dataset using local SAM 2, useful for pre-labeling defect masks.
    architectures: [inspection-training-data]

  - id: fastdup-dataset-cleaning
    name: fastdup Dataset Cleaning
    url: https://github.com/backblaze-b2-samples/fastdup-dataset-cleaning
    group: building-block
    summary: Duplicate, outlier and corrupt-file detection with quality reports and quarantine without deleting originals
    description: Finds exact and near duplicates, outliers and corrupt files in B2 image datasets, writes quality reports, and quarantines flagged files without deleting originals.
    architectures: [inspection-training-data]

  - id: duckdb-query-in-place
    name: DuckDB Query In Place
    url: https://github.com/backblaze-b2-samples/duckdb-query-in-place
    group: building-block
    summary: SQL over Parquet, CSV and JSON in B2 through DuckDB httpfs, materializing results back as Parquet
    description: DuckDB httpfs pointed at the B2 endpoint queries Parquet, CSV and JSON in place and materializes result slices back to B2 as Parquet.
    architectures: [ai-inspection-detection]

  - id: b2-event-broker
    name: B2 Event Broker
    url: https://github.com/backblaze-b2-samples/b2-event-broker
    group: building-block
    summary: Cloudflare Worker that validates signed B2 Event Notifications and fans them out to subscribers
    description: Validates signed B2 Event Notifications and fans them out to subscribers; this is where filtering for the manifest key happens, because B2 rules filter by prefix only.
    architectures: [flight-capture-offload, photogrammetry-processing, ai-inspection-detection]

  - id: cloudflare-b2
    name: cloudflare-b2 (private bucket via Worker)
    url: https://github.com/backblaze-b2-samples/cloudflare-b2
    group: building-block
    summary: Cloudflare Worker that signs range requests to a private B2 bucket for CDN delivery
    description: A Worker signs requests to a private B2 bucket and passes range requests through, for CDN delivery of COGs and 3D tilesets without a public bucket.
    architectures: [cog-map-serving, point-cloud-3d-streaming]

  - id: b2-browser-upload
    name: B2 Browser Upload
    url: https://github.com/backblaze-b2-samples/b2-browser-upload
    group: building-block
    summary: Browser-direct upload by S3 presigned PUT or b2_upload_file through a Node.js back end (5 GB single-upload cap)
    description: Browser-direct upload to B2 by S3 presigned PUT or b2_upload_file with keys held server-side; single uploads are capped at 5 GB, so it fits field portals for stills while video needs multipart.
    architectures: [flight-capture-offload]

  - id: ifcopenshell-bim-archive
    name: IfcOpenShell BIM Archive
    url: https://github.com/backblaze-b2-samples/ifcopenshell-bim-archive
    group: domain
    summary: IFC models, meshes and reports per project with manifests, served by presigned URL
    description: IFC models, meshes and reports are archived per project with manifests and served by presigned URL; pairs with construction survey twins for progress comparison.
    architectures: [point-cloud-3d-streaming]
